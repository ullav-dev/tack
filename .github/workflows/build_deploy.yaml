name: build_deploy

on:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  publish-tack-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ullav-dev'
      - name: Publish @ullav-dev/tack-notes (if version is new)
        working-directory: packages/tack-notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm show @ullav-dev/tack-notes@$VERSION version 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "Publishing @ullav-dev/tack-notes@$VERSION"
            npm publish
          else
            echo "@ullav-dev/tack-notes@$VERSION already published, skipping"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_CLASSIC }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ullav-dev/tack:${{ steps.commit.outputs.short }}
            ghcr.io/ullav-dev/tack:latest
